services:
  - type: web
    name: delve-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Set these in the Render dashboard after import — never commit
      # real keys. sync: false means Render prompts you to fill them
      # in manually instead of expecting them in this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Tighten this to your exact Vercel URL once you have it (see
      # DEPLOYMENT.md) — "*" is fine only for initial testing.
      - key: ALLOWED_ORIGINS
        value: "*"
